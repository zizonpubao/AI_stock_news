# 리눅스 서버(또는 로컬)에서 백엔드 컨테이너 실행.
# DB 는 외부 클라우드 PostgreSQL(Neon/Supabase 등)을 사용합니다.
# 값은 같은 폴더의 .env 파일에서 주입됩니다. (.env.example 참고)
services:
  backend:
    build:
      context: ./backend
    container_name: stockpulse-backend
    restart: unless-stopped
    # 메모리 1GB 서버 기준: 컨테이너가 서버 전체 메모리를 다 쓰지 못하게 제한.
    # JVM 힙은 Dockerfile 의 MaxRAMPercentage 로 이 한도 안에서 정해진다.
    mem_limit: 640m
    # 컨테이너 로그가 디스크를 채우지 않도록 순환(10MB x 3개)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: Asia/Seoul                          # 컨테이너 OS 시간대도 KST 로
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: ${DATABASE_URL}            # 예) jdbc:postgresql://ep-xxx.neon.tech/dbname?sslmode=require
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}   # 비우면 Claude 를 건너뛰고 Gemini 로 분석
      ANALYSIS_MODELS: ${ANALYSIS_MODELS:-}       # 비우면 기본 체인(claude:claude-haiku-5-5,gemini:gemini-3.5-flash-lite)
      NEWS_BODY_ENABLED: ${NEWS_BODY_ENABLED:-true}   # 기사 본문 수집. 끄려면 false (요약문만 사용)
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}              # 관리용 API 토큰. 비우면 수동 갱신/아카이브 API 차단
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,https://*.vercel.app}
    ports:
      - "8080:8080"
    # healthcheck 는 넣지 않음: 런타임 이미지(eclipse-temurin:17-jre)에 curl/wget 이
    # 들어 있는지 확인하지 못했다. 헬스 확인은 배포 워크플로가 서버에서 /api/health 로 수행한다.

# 로컬에서 굳이 컨테이너 DB 를 쓰고 싶으면 아래 주석을 풀고 backend 에 depends_on 을 추가하세요.
# 기본 경로는 Neon/Supabase 같은 무료 클라우드 DB 사용입니다.
