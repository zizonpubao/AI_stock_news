# EC2(또는 로컬)에서 백엔드 컨테이너 실행.
# DB 는 외부 클라우드 PostgreSQL(Neon/Supabase 등)을 사용합니다.
# 값은 같은 폴더의 .env 파일에서 주입됩니다. (.env.example 참고)
services:
  backend:
    build:
      context: ./backend
    container_name: stockpulse-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul                          # 컨테이너 OS 시간대도 KST 로
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: ${DATABASE_URL}            # 예) jdbc:postgresql://ep-xxx.neon.tech/dbname?sslmode=require
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,https://*.vercel.app}
    ports:
      - "8080:8080"

# 로컬에서 굳이 컨테이너 DB 를 쓰고 싶으면 아래 주석을 풀고 backend 에 depends_on 을 추가하세요.
# 기본 경로는 Neon/Supabase 같은 무료 클라우드 DB 사용입니다.
