plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.stocknews'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// 모델 비교 실험용 소스 세트. 운영 코드(main)를 그대로 가져다 쓰되, Claude·OpenAI SDK 는 여기에만 둔다.
// bootJar 는 main 의 runtimeClasspath 만 담으므로 이 SDK 들은 운영 JAR 에 들어가지 않는다.
sourceSets {
    experiment {
        // 소스는 기본 위치 src/experiment/java, 리소스는 src/experiment/resources
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + configurations.runtimeClasspath
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation 'io.projectreactor.netty:reactor-netty-http'

    // 모델 비교 실험 전용 (운영 JAR 에 포함되지 않는다)
    experimentImplementation 'com.anthropic:anthropic-java:3.3.0'
    experimentImplementation 'com.openai:openai-java:4.108.0'
    // 실험의 순수 함수(지표 계산)를 기존 test 소스 세트에서 테스트한다
    testImplementation sourceSets.experiment.output
}

tasks.named('test') {
    useJUnitPlatform()
}

jar {
    enabled = false
}

// 모델 비교 실험 실행: ./gradlew modelExperiment  (키는 환경변수, 설정은 EXPERIMENT_* 환경변수)
tasks.register('modelExperiment', JavaExec) {
    group = 'verification'
    description = 'Gemini/Claude/OpenAI 최저가 모델에 같은 입력을 보내 결과를 비교한다 (운영 서버에서 돌리지 않는다).'
    classpath = sourceSets.experiment.runtimeClasspath
    mainClass = 'com.stocknews.service.ModelExperimentRunner'
    workingDir = projectDir
    standardOutput = System.out
}