spring:
  application:
    name: stock-news-backend
  profiles:
    active: local  # 기본은 로컬
  jackson:
    serialization:
      write-dates-as-timestamps: false   # 날짜를 ISO 문자열로 (프론트 Invalid Date 방지)
    time-zone: Asia/Seoul

server:
  port: 8080

# 관리용 API(수동 갱신·수동 아카이브) 보호 토큰. 비워 두면 관리용 API 는 전부 차단된다.
admin:
  token: ${ADMIN_TOKEN:}

# AI 분석 체인: "제공자:모델" 쉼표 목록, 앞에서부터 시도하고 실패하면 다음으로 넘어간다. 키 없는 제공자는 건너뛴다.
# 환경변수 ANALYSIS_MODELS 가 비어 있으면(docker compose 가 빈 값으로 넘겨도) 코드의 기본 체인
# (GeminiAnalysisService.DEFAULT_CHAIN = claude:claude-haiku-5-5,gemini:gemini-3.5-flash-lite)을 쓴다.
analysis:
  models: ${ANALYSIS_MODELS:}

anthropic:
  api:
    key: ${ANTHROPIC_API_KEY:}

scheduler:
  stock-update:
    cron: "0 0 8-20 * * MON-FRI"   # 평일 8~20시 매시 정각 (넥스트레이드 프리장 08시 ~ 애프터마켓 20시)

logging:
  level:
    com.stocknews: DEBUG
    org.springframework.web: INFO