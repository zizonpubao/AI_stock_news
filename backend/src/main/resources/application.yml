spring:
  application:
    name: stock-news-backend
  profiles:
    active: local  # 기본은 로컬
  jackson:
    serialization:
      write-dates-as-timestamps: false   # 날짜를 ISO 문자열로 (프론트 Invalid Date 방지)
    time-zone: Asia/Seoul

server:
  port: 8080

# 관리용 API(수동 갱신·수동 아카이브) 보호 토큰. 비워 두면 관리용 API 는 전부 차단된다.
admin:
  token: ${ADMIN_TOKEN:}

# AI 분석 체인: "제공자:모델" 쉼표 목록, 앞에서부터 시도하고 실패하면 다음으로 넘어간다. 키 없는 제공자는 건너뛴다.
# 환경변수 ANALYSIS_MODELS 가 비어 있으면(docker compose 가 빈 값으로 넘겨도) 코드의 기본 체인
# (GeminiAnalysisService.DEFAULT_CHAIN = claude:claude-haiku-5-5,gemini:gemini-3.5-flash-lite)을 쓴다.
analysis:
  models: ${ANALYSIS_MODELS:}

anthropic:
  api:
    key: ${ANTHROPIC_API_KEY:}

# 기사 본문 수집 (언론사 원문 주소). robots.txt 를 지킨다. 끄려면 NEWS_BODY_ENABLED=false
news:
  body:
    enabled: ${NEWS_BODY_ENABLED:true}
    max-chars: 1500
    timeout-ms: 5000
    max-bytes: 1048576
    user-agent: "Mozilla/5.0 (compatible; NewsBodyFetcher/1.0)"
    # robots.txt 의 `*` 규칙을 따르고, 검색·인용형 AI 수집기를 이름으로 금지한 호스트는 추가로 건너뛴다.
    # 학습용 수집기(GPTBot 등)만 금지한 곳은 수집한다(이 서비스는 기사를 학습에 쓰지 않는다)
    ai-agents: OAI-SearchBot,ChatGPT-User,Claude-SearchBot,Claude-User,PerplexityBot,Perplexity-User
  # 종목 별칭: 기사 제목이 종목명과 다른 표기를 쓰는 종목의 보조 검색어. 키는 종목코드.
  # 네이버 증권 응답에는 별칭이 없어 손으로 관리한다. 목록에 없는 종목은 종목명만으로 검색한다(기존 동작).
  # 넣는 기준: 종목명과 같은 회사를 가리키는 표기일 것. 다른 뜻으로도 쓰이는 짧은 표기(JYP, SM)는 넣지 않는다.
  # 끄려면 NEWS_ALIASES_ENABLED=false
  aliases:
    enabled: ${NEWS_ALIASES_ENABLED:true}
    by-code:
      "035420": [네이버]                       # NAVER
      "035900": [JYP엔터테인먼트, JYP엔터]      # JYP Ent.
      "041510": [SM엔터테인먼트, SM엔터]        # 에스엠

scheduler:
  stock-update:
    cron: "0 0 8-20 * * MON-FRI"   # 평일 8~20시 매시 정각 (넥스트레이드 프리장 08시 ~ 애프터마켓 20시)

logging:
  level:
    com.stocknews: DEBUG
    org.springframework.web: INFO