spring:
  application:
    name: stock-news-backend
  profiles:
    active: local  # 기본은 로컬
  jackson:
    serialization:
      write-dates-as-timestamps: false   # 날짜를 ISO 문자열로 (프론트 Invalid Date 방지)
    time-zone: Asia/Seoul

server:
  port: 8080

scheduler:
  stock-update:
    cron: "0 0 8-20 * * MON-FRI"   # 평일 8~20시 매시 정각 (넥스트레이드 프리장 08시 ~ 애프터마켓 20시)

logging:
  level:
    com.stocknews: DEBUG
    org.springframework.web: INFO