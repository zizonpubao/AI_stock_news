name: Model experiment

# 모델 선택 근거를 만들기 위한 실험: 운영 공개 API 의 종목·뉴스를 읽어, 운영과 같은 프롬프트·스키마로
# Gemini(Gemma 포함) / Claude / OpenAI / OpenAI 호환(Upstage, CLOVA, Groq, DeepSeek) 의 모델에 똑같이 보내고 결과를 잰다. 운영 서버(메모리 1GB)에는 올리지 않고 이 러너에서만 돈다.
# - 운영 DB·서버에는 쓰지 않는다 (공개 GET API 읽기만).
# - 키가 없는 제공자는 호출하지 않고 SKIPPED_NO_KEY 로 표시한다.
# - 호출한 모델이 하나도 성공하지 못했을 때만 job 이 실패한다. 결과 파일은 실패해도 아티팩트로 올린다.
# - 호출은 유료다. 실행은 workflow_dispatch 또는 experiment/** 브랜치 푸시에서만 일어난다.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "비교할 모델 '제공자:모델ID' 쉼표 목록 (비우면 기본 5개 모델). 제공자: gemini(Gemma 포함), claude, openai, upstage, clova, groq, deepseek. 예: gemini:gemini-2.5-flash,gemini:gemma-4-31b-it,claude:claude-haiku-5-5,openai:gpt-6-luna,upstage:solar-mini4,clova:HCX-007"
        required: false
        type: string
      runs:
        description: "모델당 반복 횟수 (비우면 3, 최대 5)"
        required: false
        type: string
  push:
    branches:
      - "experiment/**"

permissions:
  contents: read

# 유료 호출이 겹치지 않도록 한 번에 하나만 실행한다
concurrency:
  group: model-experiment
  cancel-in-progress: false

jobs:
  experiment:
    name: Run model experiment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Run experiment
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew modelExperiment --console=plain
        env:
          # 시크릿과 입력값은 env 로만 넘긴다 (run 스크립트에 직접 끼워 넣지 않는다)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UPSTAGE_API_KEY: ${{ secrets.UPSTAGE_API_KEY }}
          CLOVA_API_KEY: ${{ secrets.CLOVA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EXPERIMENT_MODELS: ${{ inputs.models }}
          EXPERIMENT_RUNS: ${{ inputs.runs }}
      - name: Add summary to job summary
        if: always()
        run: |
          if [ -f backend/build/experiment/summary.md ]; then
            cat backend/build/experiment/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "summary.md 가 만들어지지 않았습니다. 위 단계의 로그를 확인하세요." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-experiment-result
          path: |
            backend/build/experiment/result.json
            backend/build/experiment/summary.md
          if-no-files-found: warn
